spring:
  application:
    name: DocStar

  datasource:
    url: jdbc:mysql://localhost:3306/docstar?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

ai:
  service:
    base-url: http://localhost:8000
